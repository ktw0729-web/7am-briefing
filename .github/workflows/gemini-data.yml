name: gemini-briefing-data
# 아침 브리핑용 자료(날씨·뉴스·증시)를 Gemini+Google 검색으로 수집해 data/briefing_data.md 로 커밋.
# 사전 준비: Actions Secrets 의 GEMINI_API_KEY (기존 daily-news 와 동일 키)
on:
  schedule:
    - cron: "10 20 * * *"    # 한국 05:10 (UTC 20:10). g2b(05:00) 직후, 06시대 브리핑 전
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gemini-briefing-data
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Gemini 자료 수집
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "::error::GEMINI_API_KEY 시크릿 없음"; exit 1; fi
          python scripts/gemini_brief_data.py
          cat data/briefing_data.md >> "$GITHUB_STEP_SUMMARY"
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/briefing_data.md
          git diff --cached --quiet || (git commit -m "gemini-data $(date -u +%FT%H)" && git pull --rebase -q && git push)
