name: daily-news
on:
  schedule:                  # UTC 기준 (한국시간 = UTC+9). 게시 목표보다 20분 먼저 시작해 만들어 두고 정시에 게시
    - cron: "40 21 * * *"    # 한국 06:40 시작 -> 07:00 아침판 게시
    - cron: "40 2 * * *"     # 한국 11:40 시작 -> 12:00 점심판 게시
    - cron: "40 11 * * *"    # 한국 20:40 시작 -> 21:00 저녁판 게시
  workflow_dispatch:
    inputs:
      args:
        description: 'main.py 옵션 (예: --sample --no-youtube)'
        required: false
        default: ''
      public:
        description: 'yes면 수동 실행도 공개로 게시'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: daily-news
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330      # 일찍 시작해도(최대 5시간 전) 정시까지 기다릴 수 있게 (GitHub 한도 360분)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 시스템 패키지 (멈추면 재시도)
        timeout-minutes: 15
        run: |
          for i in 1 2 3; do
            timeout 240 sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=20 \
              && timeout 420 sudo apt-get install -y ffmpeg fonts-noto-cjk libcairo2 && break
            echo "apt 재시도 $i"; sleep 5
          done
      - run: pip install -r requirements.txt
      - run: python main.py ${{ github.event.inputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # 무료 요약용. (ANTHROPIC_API_KEY를 다시 넣으면 Claude 일러스트 생성이 켜짐 = 유료)
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PUBLISH_WAIT: ${{ github.event_name == 'schedule' && '1' || '' }}
          YT_PRIVACY: ${{ (github.event_name == 'schedule' || github.event.inputs.public == 'yes') && 'public' || 'private' }}   # 정기 실행은 공개(예약 시각에 자동 공개), 수동 실행은 비공개 테스트
      - name: Save history (오늘 다룬 이슈 기록)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history || true
          git diff --cached --quiet || (git commit -m "history $(date -u +%FT%H)" && git pull --rebase -q && git push)
      - uses: actions/upload-artifact@v4
        with: { name: news-output, path: out/ }
      - uses: actions/upload-artifact@v4
        with: { name: cardnews, path: "out/*/cardnews/" }
