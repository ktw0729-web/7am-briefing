name: daily-news
on:
  schedule:                  # UTC 기준 (한국시간 = UTC+9). GitHub 사정으로 5~20분 늦을 수 있음
    - cron: "0 22 * * *"     # 한국 07:00 아침판
    - cron: "0 3 * * *"      # 한국 12:00 점심판
    - cron: "0 12 * * *"     # 한국 21:00 저녁판
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-news
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_PRIVACY: private
      - name: Save history (오늘 다룬 이슈 기록)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history || true
          git diff --cached --quiet || (git commit -m "history $(date -u +%FT%H)" && git pull --rebase -q && git push)
      - uses: actions/upload-artifact@v4
        with: { name: news-output, path: out/ }
      - uses: actions/upload-artifact@v4
        with: { name: cardnews, path: "out/*/cardnews/" }
