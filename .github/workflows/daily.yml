name: daily-news
on:
  schedule:                  # UTC 기준 (한국시간 = UTC+9). 게시 목표보다 20분 먼저 시작해 만들어 두고 정시에 게시
    - cron: "40 21 * * *"    # 한국 06:40 시작 -> 07:00 아침판 게시
    - cron: "40 2 * * *"     # 한국 11:40 시작 -> 12:00 점심판 게시
    - cron: "40 11 * * *"    # 한국 20:40 시작 -> 21:00 저녁판 게시
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-news
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PUBLISH_WAIT: ${{ github.event_name == 'schedule' && '1' || '' }}
          YT_PRIVACY: private   # 검수 후 public 으로 바꾸면 예약 시각에 자동 공개
      - name: Save history (오늘 다룬 이슈 기록)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history || true
          git diff --cached --quiet || (git commit -m "history $(date -u +%FT%H)" && git pull --rebase -q && git push)
      - uses: actions/upload-artifact@v4
        with: { name: news-output, path: out/ }
      - uses: actions/upload-artifact@v4
        with: { name: cardnews, path: "out/*/cardnews/" }
