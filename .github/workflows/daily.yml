name: daily-news
on:
  # 정기 실행은 cron-job.org 가 workflow_dispatch(timed=yes)로 호출한다(06:00/11:00/20:00 KST). GitHub 자체 cron 은 지연/누락이 심해 제거함.
  workflow_dispatch:
    inputs:
      args:
        description: 'main.py 옵션 (예: --sample --no-youtube)'
        required: false
        default: ''
      public:
        description: 'yes면 수동 실행도 공개로 게시'
        required: false
        default: ''
      timed:
        description: 'yes면 정기 실행처럼 동작(외부 스케줄러용: 중복·지연 방지, 정시 게시)'
        required: false
        default: ''
permissions:
  contents: write
  actions: write   # 아침 판에서 g2b-bids 워크플로를 바로 실행하기 위해
concurrency:
  group: daily-news-${{ github.run_id }}   # 승인 대기 중인 실행이 다른 판을 막지 않도록 실행별로 분리(중복은 history의 pending/flag 파일로 방지)
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.chk.outputs.ready }}
    timeout-minutes: 330      # 일찍 시작해도(최대 5시간 전) 정시까지 기다릴 수 있게 (GitHub 한도 360분)
    steps:
      - name: 아침 판이면 입찰공고(g2b) 수집도 바로 실행 (GitHub 예약 실행 지연 대비)
        if: github.event.inputs.timed == 'yes'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          h=$(TZ=Asia/Seoul date +%H)
          if [ "$h" -ge 3 ] && [ "$h" -le 6 ]; then
            gh workflow run g2b.yml --repo "$GITHUB_REPOSITORY" && echo "g2b-bids 실행 요청함 ($h시)"
          else
            echo "아침 판 아님($h시) - g2b 실행 생략"
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 시스템 패키지 (멈추면 재시도)
        timeout-minutes: 15
        run: |
          for i in 1 2 3; do
            timeout 240 sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=20 \
              && timeout 420 sudo apt-get install -y ffmpeg fonts-noto-cjk libcairo2 && break
            echo "apt 재시도 $i"; sleep 5
          done
      - run: pip install -r requirements.txt
      - id: ed
        name: 판 확정 (크론 시각 -> 아침/점심/저녁)
        run: |
          case "${{ github.event.schedule }}" in
            "0 21 * * *"|"30 21 * * *"|"10 22 * * *") e=morning;;
            "0 2 * * *"|"30 2 * * *"|"10 3 * * *") e=noon;;
            "0 11 * * *"|"30 11 * * *"|"10 12 * * *") e=evening;;
            *) e="";;
          esac
          echo "e=$e" >> "$GITHUB_OUTPUT"
      - run: python main.py --stage prepare ${{ github.event.inputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # 무료 요약용. (ANTHROPIC_API_KEY를 다시 넣으면 Claude 일러스트 생성이 켜짐 = 유료)
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: "17841475244640305"
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}   # 무료 AI 장면 이미지(Cloudflare Workers AI)
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          EDITION: ${{ steps.ed.outputs.e }}   # 정기 실행은 크론으로 판을 확정(일찍/늦게 시작해도 판 오분류 방지)
          DEDUP: ${{ (github.event_name == 'schedule' || github.event.inputs.timed == 'yes') && '1' || '' }}   # 정기 실행은 이미 게시된 판이면 건너뜀
          PUBLISH_WAIT: ${{ github.event_name == 'schedule' && '1' || '' }}
          YT_PRIVACY: ${{ (github.event_name == 'schedule' || github.event.inputs.timed == 'yes' || github.event.inputs.public == 'yes') && 'public' || 'private' }}   # 정기 실행은 공개(예약 시각에 자동 공개), 수동 실행은 비공개 테스트
      - name: Save history (오늘 다룬 이슈 기록)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history || true
          git diff --cached --quiet || (git commit -m "history $(date -u +%FT%H)" && git pull --rebase -q && git push)
      - uses: actions/upload-artifact@v4
        with: { name: news-output, path: out/ }
      - uses: actions/upload-artifact@v4
        with: { name: cardnews, path: "out/*/cardnews/" }
      - name: 승인 대기 상태 확인
        id: chk
        run: |
          if [ -f pending/pending.json ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@v4
        if: steps.chk.outputs.ready == 'true'
        with: { name: pending, path: pending/ }

  publish:
    # 준비 완료 후 자동 실행(승인 없음): 목표 시각까지 대기했다가 유튜브 공개 + Threads + 인스타 게시
    needs: run
    if: needs.run.outputs.ready == 'true' && (github.event_name == 'schedule' || github.event.inputs.timed == 'yes' || github.event.inputs.public == 'yes')
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: { name: pending, path: pending/ }
      - run: git pull --rebase -q
      - run: python main.py --stage publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: "17841475244640305"
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - name: Save history (게시 기록)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A history || true
          git diff --cached --quiet || (git commit -m "published $(date -u +%FT%H)" && git pull --rebase -q && git push)
