name: g2b-bids
# 나라장터 입찰공고 조회: 수요기관이 조달청 본청 또는 대전광역시인 공고만.
# 결과는 g2b/latest.md 로 커밋(아침 브리핑이 읽어감). 기존 daily-news(게시 파이프라인)와 분리.
# 사전 준비: Settings > Secrets and variables > Actions 에 G2B_SERVICE_KEY 등록
on:
  schedule:
    # 브리핑(06:20 KST) 전에 끝나도록 일찍, 그리고 GitHub가 가장 붐비는 정각(분=0)을 피해 2회 실행한다.
    # (정각 cron이 7~8시간씩 지연된 사례가 있었음. 지연은 완전히 막을 수 없다.)
    - cron: "37 17 * * *"    # 한국 02:37 (UTC 17:37)
    - cron: "47 19 * * *"    # 한국 04:47 (UTC 19:47) — 위 실행이 밀렸을 때를 대비한 예비
  workflow_dispatch:
    inputs:
      days:
        description: '최근 N일 게시분 조회'
        required: false
        default: '1'
permissions:
  contents: write
concurrency:
  group: g2b-bids
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 나라장터 입찰공고 조회
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
          DAYS: ${{ github.event.inputs.days || '1' }}
        run: |
          set -o pipefail
          if [ -z "$G2B_SERVICE_KEY" ]; then
            echo "::error::G2B_SERVICE_KEY 시크릿이 없습니다."
            exit 1
          fi
          mkdir -p g2b
          python scripts/nara_g2b.py --days "$DAYS" --format md | tee g2b/latest.md
          cat g2b/latest.md >> "$GITHUB_STEP_SUMMARY"
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add g2b/latest.md
          git diff --cached --quiet || (git commit -m "g2b $(date -u +%FT%H)" && git pull --rebase -q && git push)
